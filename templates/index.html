<!DOCTYPE html>
<html>
<head>
    <title>FakeNewsGuard System</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7c3aed, #c026d3, #ec4899);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            color: white;

            display: flex;
            flex-direction: column;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            max-width: 650px;
            margin: 20px auto;
            width: 90%;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            animation: floatBox 4s ease-in-out infinite;
        }

        @keyframes floatBox {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            text-align: center;
            text-shadow: 0 0 10px #fff, 0 0 20px #ec4899, 0 0 30px #7c3aed;
        }

        .subtitle {
            text-align: center;
            color: #fbcfe8;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: white;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(90deg, #ec4899, #7c3aed, #ec4899);
            border: none;
            padding: 12px 25px;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: auto;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ec4899;
        }

        #loading {
            text-align: center;
            margin-top: 10px;
            color: #fde68a;
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        #progress {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        #result {
            text-align: center;
            margin-top: 15px;
            font-size: 20px;
        }

        #percent {
            text-align: center;
            margin-top: 8px;
            font-weight: bold;
        }

        #related {
            margin-top: 15px;
        }

        a {
            color: #fde68a;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: auto;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #fbcfe8;
        }

        hr {
            margin-bottom: 10px;
            opacity: 0.2;
        }
    </style>
</head>

<body>

<div class="main-wrapper">

<div class="container">

    <h1>🤖 FakeNewsGuard</h1>
    <p class="subtitle">AI-powered misinformation detection system</p>

    <textarea id="news" placeholder="Paste news here..."></textarea>

    <button onclick="predict()">🚀 Analyze News</button>

    <p id="loading" class="hidden">🔍 Analyzing...</p>

    <div id="result-box" class="hidden">
        <h2 id="result"></h2>

        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <p id="percent"></p>

        <div id="related"></div>
    </div>

</div>

</div>

<footer>
    <hr>
    <div>
        <strong>Developed by:</strong><br>
        AIMEE JANE S. ANSING<br>
        JULIEMER T. BORDA<br>
        NURMIRA A. DULLAH
    </div>
    <div style="margin-top: 8px;">
        Bachelor of Science in Computer Science<br>
        Jose Rizal Memorial State University - Siocon Campus
    </div>
    <div style="margin-top: 5px; font-size: 12px;">
        © 2026 FakeNewsGuard System
    </div>
</footer>

<script>
function predict() {
    const text = document.getElementById("news").value;

    if (!text.trim()) {
        alert("Please enter news text");
        return;
    }

    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("result-box").classList.add("hidden");

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("result-box").classList.remove("hidden");

        // ✅ FIXED CONFIDENCE (NO MORE 9000%)
        let confidence;

        if (data.fake_prob !== undefined && data.fake_prob !== null) {
            confidence = Math.round(data.fake_prob * 100);
        } else if (data.confidence !== undefined && data.confidence !== null) {
            confidence = Math.round(data.confidence);
        } else {
            confidence = 50;
        }

        let result = document.getElementById("result");
        let progress = document.getElementById("progress");
        let percent = document.getElementById("percent");
        let related = document.getElementById("related");

        if (data.label === "real") {
            result.innerHTML = "✅ Verified as Real News";
            result.style.color = "#4ade80";
            progress.style.background = "#22c55e";
        } else {
            result.innerHTML = "❌ Fake News Detected";
            result.style.color = "#f87171";
            progress.style.background = "#ef4444";
        }

        progress.style.width = confidence + "%";
        percent.innerText = confidence + "% confidence";

        related.innerHTML = "";

        if (data.label === "real" && data.links && data.links.length > 0) {
            related.innerHTML = "<strong>Supporting Evidence:</strong><ul>";

            data.links.forEach(link => {
                related.innerHTML += `<li><a href="${link}" target="_blank">${link}</a></li>`;
            });

            related.innerHTML += "</ul>";
        }

    })
    .catch(err => {
        console.error(err);
        alert("Server error");
        document.getElementById("loading").classList.add("hidden");
    });
}
</script>

</body>
</html>
