<!DOCTYPE html>
<html>
<head>
    <title>FakeNewsGuard System</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7c3aed, #c026d3, #ec4899);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: white;
            margin-bottom: 15px;
        }

        button {
            display: block;
            margin: auto;
            padding: 12px 25px;
            border-radius: 999px;
            border: none;
            color: white;
            font-weight: bold;
            background: linear-gradient(90deg, #ec4899, #7c3aed);
            cursor: pointer;
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            height: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        #progress {
            height: 100%;
            width: 0%;
            border-radius: 10px;
        }

        #result {
            text-align: center;
            margin-top: 15px;
        }

        #percent {
            text-align: center;
            margin-top: 5px;
        }

        #related {
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: auto;
            padding: 10px;
        }

        a {
            color: yellow;
        }
    </style>
</head>

<body>

<div class="main-wrapper">
<div class="container">

    <h1>🤖 FakeNewsGuard</h1>
    <p class="subtitle">AI-powered misinformation detection system</p>

    <textarea id="news" placeholder="Paste news here..."></textarea>

    <button onclick="predict()">🚀 Analyze News</button>

    <p id="loading" class="hidden">Analyzing...</p>

    <div id="result-box" class="hidden">
        <h2 id="result"></h2>

        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <p id="percent"></p>

        <div id="related"></div>
    </div>

</div>
</div>

<footer>
    Developed by:<br>
    AIMEE • JULIEMER • NURMIRA
</footer>

<script>
function predict() {
    const text = document.getElementById("news").value;

    if (!text.trim()) {
        alert("Enter news first");
        return;
    }

    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("result-box").classList.add("hidden");

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("result-box").classList.remove("hidden");

        let confidence = 50;

        if (data.confidence !== undefined) {
            confidence = Math.round(data.confidence);
        }

        let result = document.getElementById("result");
        let progress = document.getElementById("progress");
        let percent = document.getElementById("percent");
        let related = document.getElementById("related");

        // RESULT
        if (data.label === "real") {
            result.innerHTML = "✅ Verified as Real News";
            result.style.color = "lime";
            progress.style.background = "lime";
        } else {
            result.innerHTML = "❌ Fake News Detected";
            result.style.color = "red";
            progress.style.background = "red";
        }

        progress.style.width = confidence + "%";
        percent.innerText = confidence + "% confidence";

        // LINKS FIXED
        related.innerHTML = "";

        if (data.label === "real") {
            related.innerHTML = "<b>Supporting Evidence:</b><ul>";

            if (data.links && data.links.length > 0) {
                data.links.forEach(link => {
                    related.innerHTML += `<li><a href="${link}" target="_blank">${link}</a></li>`;
                });
            } else {
                related.innerHTML += "<li>No sources found</li>";
            }

            related.innerHTML += "</ul>";
        }

    })
    .catch(err => {
        console.error(err);
        alert("Server error");
    });
}
</script>

</body>
</html>
